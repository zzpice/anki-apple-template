<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Apple 风格 Anki 模板预览</title>
  <style>
    body { margin:0; font:16px sans-serif; height:100vh; display:flex; flex-direction:column; }
    header { padding:.6rem 1rem; background:#f5f6f7; display:flex; flex-wrap:wrap; gap:.5rem 1rem; }
    select { font:inherit; }
    iframe { display:block; width:100%; flex:1; min-height:0; border:0; }
    #status { margin:0; }
  </style>
</head>
<body>
  <header>
    <label>预览主题
      <select id="theme">
        <option value="system">跟随系统</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <label>卡片面
      <select id="side">
        <option value="back">背面</option>
        <option value="front">正面</option>
      </select>
    </label>
    <label>示例
      <select id="sample">
        <option value="0">完整内容</option>
        <option value="1">可选字段为空</option>
      </select>
    </label>
    <a href="./downloads/anki-apple-template.apkg" download>下载 Anki 安装包</a>
    <p id="status" role="status">正在读取模板…</p>
  </header>
  <iframe id="preview" title="卡片预览"></iframe>

  <script>
    var theme = document.getElementById('theme');
    var frame = document.getElementById('preview');
    var side = document.getElementById('side');
    var sample = document.getElementById('sample');
    var darkMedia;

    function applyTheme() {
      if (!darkMedia) return;
      frame.contentDocument.documentElement.className = theme.value === 'dark' ? 'nightMode' : '';
      // 使用真实 CSS；强制浅色时仅关闭系统深色规则，无需复制配色。
      darkMedia.mediaText = theme.value === 'system' ? '(prefers-color-scheme: dark)' : 'not all';
    }
    theme.onchange = applyTheme;

    Promise.all(['front.html', 'back.html', 'style.css', 'samples.json'].map(function (path) {
      return fetch(path).then(function (response) {
        if (!response.ok) throw new Error(path + ': ' + response.status);
        return response.text();
      });
    })).then(function (files) {
      // 与安装包共用示例；仅模拟本模板的条件字段和原生 Hint。
      var examples = JSON.parse(files[3]);
      function updatePreview() {
        darkMedia = null;
        var example = examples[Number(sample.value)];
        var fields = Object.assign({}, example.fields, {Tags: example.tags.join(' ')});
        fields['hint:相关知识'] = '<a class="hint" href="#" onclick="this.style.display=\'none\';' +
          'this.nextElementSibling.style.display=\'block\';return false;">相关知识</a>' +
          '<div class="hint" style="display:none">' + fields['相关知识'] + '</div>';
        function render(template) {
          return template.replace(/{{#([^}]+)}}([\s\S]*?){{\/\1}}/g, function (_, name, content) {
            return fields[name] ? content : '';
          }).replace(/{{([^}]+)}}/g, function (_, name) { return fields[name]; });
        }
        fields.FrontSide = render(files[0]);
        frame.srcdoc = '<!doctype html><html lang="zh-CN"><head><meta name="viewport" content="width=device-width,initial-scale=1">' +
          '<style>' + files[2] + '</style></head><body class="card">' +
          (side.value === 'front' ? fields.FrontSide : render(files[1])) + '</body></html>';
      }
      frame.onload = function () {
        var rules = frame.contentDocument.styleSheets[0].cssRules;
        darkMedia = Array.from(rules).find(function (rule) {
          return rule.conditionText && rule.conditionText.includes('prefers-color-scheme');
        }).media;
        applyTheme();
      };
      side.onchange = sample.onchange = updatePreview;
      updatePreview();
      document.getElementById('status').textContent = '';
    }).catch(function (error) {
      document.getElementById('status').textContent = error.message + '。请通过本地 HTTP 服务打开预览，见 README。';
    });
  </script>
</body>
</html>
