<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151c19" media="(prefers-color-scheme: dark)">
  <meta name="description" content="个人 Anki 模板，支持问答、选择、填空、图片遮挡和思维导图。">
  <link rel="stylesheet" href="./web/design.css">
  <link rel="icon" href="./web/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./web/icon-180.png">
  <title>Anki 示例预览 · ZZP</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:var(--zzp-bg); color:var(--zzp-text); font:16px/1.65 var(--zzp-font); }
    .preview-shell { max-width:1080px; margin:auto; padding:16px 24px; }
    header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 20px; }
    h1 { font-size:20px; font-weight:600; margin:0; }
    nav { display:flex; flex-wrap:wrap; gap:0 18px; }
    a { color:inherit; text-underline-offset:4px; }
    nav a { display:inline-flex; align-items:center; min-height:44px; }
    :focus-visible { outline:3px solid var(--zzp-accent); outline-offset:3px; }
    .intro { color:var(--zzp-muted); margin:8px 0 20px; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px 20px; padding:16px 0; border-top:1px solid var(--zzp-line); }
    label { display:flex; align-items:center; gap:8px; }
    select,button { font:inherit; color:inherit; background:var(--zzp-surface); border:1px solid var(--zzp-line-strong); border-radius:var(--zzp-radius-sm); padding:8px 10px; min-height:44px; max-width:100%; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.5; }
    #preview { display:block; width:100%; max-width:100%; margin-inline:auto; border:0; min-height:570px; height:calc(100vh - 280px); background:var(--zzp-surface); }
    body[data-viewport="phone"] #preview { width:390px; }
    #status { margin:0; color:var(--zzp-muted); font-size:14px; }
    [hidden] { display:none !important; }
    @media (max-width:480px) {
      .preview-shell { padding:12px 16px; }
      .intro { margin-bottom:12px; }
      .controls { gap:12px; }
      #preview { min-height:560px; }
    }
  </style>
  <link rel="canonical" href="https://zzpice.github.io/anki-template/preview.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="ZZP 工具与资源">
  <meta property="og:title" content="Anki 示例预览 · ZZP">
  <meta property="og:description" content="个人 Anki 模板，支持问答、选择、填空、图片遮挡和思维导图。">
  <meta property="og:url" content="https://zzpice.github.io/anki-template/preview.html">
  <meta property="og:image" content="https://zzpice.github.io/anki-template/web/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Anki 模板 · ZZP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Anki 示例预览 · ZZP">
  <meta name="twitter:description" content="个人 Anki 模板，支持问答、选择、填空、图片遮挡和思维导图。">
  <meta name="twitter:image" content="https://zzpice.github.io/anki-template/web/social-preview.png">
</head>
<body data-theme="system" data-viewport="auto">
  <a class="skip-link" href="#main">跳到预览控制</a>
  <main id="main" tabindex="-1" class="preview-shell">
    <a class="ecosystem-link" href="https://zzp.moe/" target="_blank" rel="noopener noreferrer" aria-label="ZZP · 所有项目（新标签页）">ZZP / 工具与资源</a>
    <header>
      <h1>Anki 模板</h1>
      <nav aria-label="项目链接">
        <a href="./">项目首页</a>
        <a href="./downloads/anki-template.apkg" download>下载安装包</a>
        <a href="./tools.html">网页制卡</a>
        <a href="https://github.com/zzpice/anki-template/blob/main/docs/usage.md">使用说明</a>
      </nav>
    </header>
    <p class="intro">选择示例，查看卡片的正面和背面。</p>
    <div class="controls">
      <label>题型 <select id="sample" disabled></select></label>
      <label id="card-label" hidden>卡片 <select id="card"></select></label>
      <label>视口
        <select id="viewport">
          <option value="auto">自适应</option>
          <option value="phone">手机 · 390px</option>
        </select>
      </label>
      <label>外观
        <select id="theme">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <button id="flip" type="button" disabled>显示答案</button>
    </div>
  </main>
  <iframe id="preview" title="Anki 卡片预览"></iframe>
  <div class="preview-shell"><p id="status" role="status">正在读取卡片…</p></div>
  <div class="preview-shell">
  <footer class="ecosystem-footer" aria-label="项目资料">
    <a href="https://zzp.moe/" target="_blank" rel="noopener noreferrer" aria-label="所有项目（新标签页）">所有项目 ↗</a>
    <a href="https://github.com/zzpice/anki-template">GitHub 仓库</a>
  </footer>
  </div>
  <script>
    (function () {
      var frame = document.getElementById('preview');
      var sample = document.getElementById('sample');
      var card = document.getElementById('card');
      var theme = document.getElementById('theme');
      var flip = document.getElementById('flip');
      var status = document.getElementById('status');
      var examples, css, back = false;

      function applyTheme() {
        document.body.dataset.theme = theme.value;
        var doc = frame.contentDocument;
        if (!doc || !doc.styleSheets.length) return;
        doc.documentElement.className = theme.value === 'dark' ? 'nightMode' : '';
        Array.from(doc.styleSheets[0].cssRules).forEach(function (rule) {
          if (rule.conditionText && rule.conditionText.indexOf('prefers-color-scheme') !== -1) {
            rule.reviewThemeMedia = true;
          }
          if (rule.reviewThemeMedia) {
            rule.media.mediaText = theme.value === 'system' ? '(prefers-color-scheme:dark)' : 'not all';
          }
        });
      }
      function render(resume) {
        var example = examples[Number(sample.value)];
        var content = example.cards[Number(card.value) || 0][back ? 'back' : 'front'];
        // 卡片 HTML 由 Anki 生成，与安装包共用样式和媒体。
        var base = new URL('./cards/media/', location.href).href;
        frame.srcdoc = '<!doctype html><html lang="zh-CN"><head>' +
          '<meta name="viewport" content="width=device-width,initial-scale=1">' +
          '<base href="' + base + '"><style>' + css + (example.css || '') + '</style></head>' +
          '<body class="card"' + (resume ? ' data-review-resume' : '') + '>' + content + '</body></html>';
        flip.textContent = back ? '返回正面' : '显示答案';
        status.textContent = example.type === 'occlusion' ?
          '图片遮挡请在 Anki 中导入体验。' :
          example.type === 'choice' ? '翻面后可核对已选项和正确答案。' :
          '按空格或点击按钮翻面。';
      }
      function chooseSample() {
        var example = examples[Number(sample.value)];
        card.textContent = '';
        example.cards.forEach(function (_, index) {
          var option = document.createElement('option');
          option.value = index;
          option.textContent = '第 ' + (index + 1) + ' 张';
          card.appendChild(option);
        });
        document.getElementById('card-label').hidden = example.cards.length < 2;
        back = false;
        render();
      }
      frame.onload = applyTheme;
      document.getElementById('viewport').onchange = function () { document.body.dataset.viewport = this.value; };
      theme.onchange = applyTheme;
      sample.onchange = chooseSample;
      card.onchange = function () { back = false; render(); };
      flip.onclick = function () { back = !back; render(!back); };
      document.addEventListener('keydown', function (event) {
        if (event.code === 'Space' && event.target === document.body && examples) {
          event.preventDefault(); flip.click();
        }
      });
      Promise.all(['web/preview-cards.json', 'cards/style.css'].map(function (name) {
        return fetch(name).then(function (response) {
          if (!response.ok) throw new Error(name + ': ' + response.status);
          return response.text();
        });
      })).then(function (files) {
        examples = JSON.parse(files[0]); css = files[1];
        examples.forEach(function (example, index) {
          var option = document.createElement('option');
          option.value = index; option.textContent = example.label; sample.appendChild(option);
        });
        sample.value = examples.findIndex(function (example) { return example.key === 'single'; });
        sample.disabled = flip.disabled = false;
        chooseSample();
      }).catch(function (error) {
        status.textContent = '无法加载预览：' + error.message + '。本地预览方法见使用说明。';
      });
    })();
  </script>
</body>
</html>
