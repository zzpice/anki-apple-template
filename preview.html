  <body data-theme="system" data-viewport="auto">
    <a class="skip-link" href="#main">跳到预览控制</a>
    <main id="main" tabindex="-1" class="preview-shell">
      <a
        class="ecosystem-link"
        href="https://zzp.moe/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ZZP · 所有项目（新标签页）"
        >ZZP / 工具与资源</a
      >
      <header>
        <h1>
          <a class="preview-brand" href="./"
            ><img src="./web/icon.svg" width="26" height="26" alt="" />Anki
            模板</a
          ><span>示例预览</span>
        </h1>
        <nav aria-label="项目链接">
          <a href="./">项目首页</a>
          <a href="./downloads/anki-template.apkg" download>下载安装包</a>
          <a href="./tools.html">网页制卡</a>
          <a
            href="https://github.com/zzpice/anki-template/blob/main/docs/usage.md"
            >使用说明</a
          >
        </nav>
      </header>
      <p class="intro">选择示例，查看卡片的正面和背面。</p>
      <div class="controls">
        <label
          >题型
          <select id="sample" disabled></select
        ></label>
        <label id="card-label" hidden
          >卡片
          <select id="card"></select
        ></label>
        <label
          >视口
          <select id="viewport">
            <option value="auto">自适应</option>
            <option value="phone">手机 · 390px</option>
          </select>
        </label>
        <label
          >外观
          <select id="theme">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <button id="flip" type="button" disabled>显示答案</button>
      </div>
    </main>
    <div class="preview-stage">
      <div id="preview-loading" class="preview-loading" role="status">
        <div class="loading-card" aria-hidden="true"><i></i><i></i><i></i></div>
        <p id="load-message">正在读取卡片…</p>
        <button id="retry" type="button" hidden>重新加载预览</button>
      </div>
      <iframe id="preview" title="Anki 卡片预览" hidden></iframe>
    </div>
    <div class="preview-shell">
      <p id="status" role="status">正在读取卡片…</p>
    </div>
    <div class="preview-shell">
      <footer class="ecosystem-footer" aria-label="项目资料">
        <a
          href="https://zzp.moe/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="所有项目（新标签页）"
          >所有项目 ↗</a
        >
        <a href="https://github.com/zzpice/anki-template">GitHub 仓库</a>
      </footer>
    </div>
    <script src="./web/preview.js?v=20261008" defer></script>
  </body>
</html>
