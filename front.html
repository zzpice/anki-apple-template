<section class="section" data-apple-template>
  <h2 class="section-title">问题</h2>
  {{#Tags}}
    <div class="tags">{{Tags}}</div>
  {{/Tags}}
  <div class="content">{{问题}}</div>
</section>

<script>
(function () {
  // Anki 可能在同一 WebView 中连续换卡；只绑定一次全局事件。
  if (!window.appleTemplate) {
    var lightbox, source;

    function closeZoom() {
      if (lightbox) lightbox.remove();
      lightbox = null;
      source = null;
      document.body.classList.remove('zooming');
    }

    // 切到其他笔记类型时，对方不会调用本模板的初始化函数。
    new MutationObserver(function () {
      if (lightbox && !source.isConnected) closeZoom();
    }).observe(document.body, {childList:true, subtree:true});

    document.addEventListener('click', function (event) {
      if (!document.querySelector('[data-apple-template]')) return;
      if (lightbox) {
        closeZoom();
      } else {
        var image = event.target.closest('.section img');
        if (!image || image.matches('.no-zoom, [data-nozoom="1"]') ||
            image.closest('a, button')) return;

        source = image;
        lightbox = document.createElement('div');
        lightbox.className = 'lightbox';
        var enlarged = document.createElement('img');
        enlarged.src = image.currentSrc || image.src;
        enlarged.alt = image.alt;
        lightbox.appendChild(enlarged);
        // 放到 body 下，不受正文布局和隐藏 Hint 的影响。
        document.body.appendChild(lightbox);
        document.body.classList.add('zooming');
      }
      event.preventDefault();
      event.stopPropagation();
    }, true);

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeZoom();
    });
    window.addEventListener('resize', closeZoom);

    window.appleTemplate = function () {
      closeZoom();
      var tables = document.querySelectorAll('.section table');
      for (var i = 0; i < tables.length; i++) {
        var table = tables[i];
        if (table.parentElement.classList.contains('scroll-x')) continue;
        var wrapper = document.createElement('div');
        wrapper.className = 'scroll-x';
        table.before(wrapper);
        wrapper.appendChild(table);
      }
    };
  }

  window.appleTemplate();
})();
</script>
