name: Check and deploy Anki templates

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: anki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        anki-version: ['25.9.2', '26.9.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fields, media and JavaScript
        run: python scripts/check_templates.py
      - name: Install build and test tools
        run: |
          python -m pip install -r scripts/requirements-build.txt
          python -m pip install "anki==${{ matrix.anki-version }}"
          python -m pip install --no-deps "aqt==${{ matrix.anki-version }}"
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Verify download, preview and native Anki import
        env:
          ANKI_RENDER_OUTPUT: build/cards.json
        run: python -m unittest discover -s tests -v
      - name: Check browser layout, interactions and native occlusion
        run: |
          node --test tests/test_tools.mjs
          node tests/test_tools_browser.cjs
          node tests/test_browser.cjs
      - name: Assemble public site
        if: matrix.anki-version == '25.9.2'
        run: |
          mkdir -p build/pages
          cp -R index.html preview.html tools.html README.md LICENSE .nojekyll web cards downloads docs build/pages/
      - name: Check the public site artifact
        if: matrix.anki-version == '25.9.2'
        run: SITE_ROOT=build/pages node tests/test_site.cjs
      - uses: actions/upload-pages-artifact@v5
        if: matrix.anki-version == '25.9.2' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v5
