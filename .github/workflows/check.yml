name: Template Check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fields, media and JavaScript
        run: python scripts/check_templates.py
      - name: Install build and test tools
        run: |
          python -m pip install -r requirements-test.txt
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Verify download and native Anki import
        env:
          ANKI_RENDER_OUTPUT: build/cards.json
        run: python -m unittest discover -s tests -v
      - name: Check browser layout and interactions
        run: node tests/test_browser.cjs
